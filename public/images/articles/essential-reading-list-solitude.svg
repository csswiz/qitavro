<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="artGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#272321"/>
      <stop offset="100%" stop-color="#110A0C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#artGrad)"/>
  
  <rect x="35" y="35" width="730" height="430" fill="none" stroke="#B69A72" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="45" y="45" width="710" height="410" fill="none" stroke="#B69A72" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Magazine Monogram / Watermark -->
  <text x="400" y="210" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="140" font-style="italic" fill="#B69A72" opacity="0.12">
    Q
  </text>

  <text x="400" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#B69A72" text-transform="uppercase">
    THE READING ROOM • READING LIST
  </text>

  <line x1="320" y1="185" x2="480" y2="185" stroke="#B69A72" stroke-width="1" stroke-opacity="0.6"/>

  <text x="400" y="270" text-anchor="middle" font-family="'Playfair Display', serif" font-size="30" font-weight="700" fill="#F6F0E8" letter-spacing="0.5">
    A Reading List for Meaningful Solitude
  </text>

  <text x="400" y="325" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="20" font-style="italic" fill="#DAC1BD">
    By Editorial Board
  </text>

  <text x="400" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#B69A72">
    OCTOBER 19, 2026 • 4 MIN READ
  </text>
</svg>